name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  COMPOSER_ROOT_VERSION: "1.0.0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mbstring
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --ignore-platform-req=php

      - name: PHP syntax
        run: composer syntax

      - name: WordPress Coding Standards
        run: composer lint

      - name: PHP compatibility
        run: composer compat

      - name: PHPStan
        if: matrix.php == '8.3'
        run: composer analyse

      - name: PHPUnit unit tests
        run: composer test

  wordpress-integration:
    name: WordPress integration tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, mysqli
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install the WordPress test library
        run: bash bin/install-wp-tests.sh wordpress_test root '' 127.0.0.1 7.1.3
        env:
          WP_TESTS_DIR: /tmp/formlyx-wordpress-tests
          WP_CORE_DIR: /tmp/formlyx-wordpress-core

      - name: PHPUnit integration tests
        run: composer test:integration
        env:
          WP_TESTS_DIR: /tmp/formlyx-wordpress-tests
          WP_TESTS_PHPUNIT_POLYFILLS_PATH: ${{ github.workspace }}/vendor/yoast/phpunit-polyfills

  javascript:
    name: JavaScript build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Check Node.js engine
        run: npm run check-engines

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Build
        run: npm run build

      - name: Confirm the build output
        run: test -f build/index.js && test -f build/index.asset.php

      - name: Package the plugin
        run: npm run plugin-zip

      - name: Confirm the package excludes development files
        run: |
          unzip -l formlyx.zip > zip-list.txt
          cat zip-list.txt
          if grep -E 'node_modules/|/vendor/|/tests/|/\.github/|/src/|composer\.(json|lock)|package(-lock)?\.json|README\.md|\.wp-env|\.gitkeep|\.map$' zip-list.txt; then
            echo "Plugin package contains development files." >&2
            exit 1
          fi
          for required in formlyx.php uninstall.php readme.txt license.txt includes/Plugin.php includes/Renderer.php includes/Blocks.php includes/embed.css build/block.json build/index.js build/index.asset.php; do
            grep -q "formlyx/${required}" zip-list.txt || {
              echo "Plugin package is missing ${required}." >&2
              exit 1
            }
          done

  plugin-check:
    name: Plugin Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.22.2'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Package the plugin
        run: npm run plugin-zip

      - name: Unpack the plugin
        run: |
          unzip -q formlyx.zip -d plugin-build
          test -f plugin-build/formlyx/formlyx.php

      - name: Run Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: plugin-build/formlyx
